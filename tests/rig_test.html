<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head><body>
<script src="../node_modules/three/build/three.min.js"></script>
<script src="../node_modules/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="../src/physics.js"></script><script src="../src/roster.js"></script><script src="../src/shotmodel.js"></script>
<script src="../src/assets.gen.js"></script><script src="../src/characters3d.js"></script><script src="../src/anim.js"></script>
<script>
window.onerror = (m, s, l, c, e) => { document.title = 'ERR ' + m + ' @' + l; };
const W = 1400, H = 700;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.outputEncoding = THREE.sRGBEncoding; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2e35);
scene.add(new THREE.HemisphereLight(0xffffff, 0x554433, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(3, 8, 6); dl.castShadow = true; scene.add(dl);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x8a6a45 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
const ballMesh = [];
window.ready = HoopCharacters.loadAll(HoopRoster.CHARACTERS, HOOP_ASSETS).then(({ models }) => {
  window.models = models;
  window.players = HoopRoster.CHARACTERS.map((def, i) => {
    const m = models[def.id]; scene.add(m.root);
    const pl = new HoopPlayer.Player(m, def);
    const p = def.sig.params; pl.setJumper(p, HoopShot.derive(p, def));
    const b = new THREE.Mesh(new THREE.SphereGeometry(HoopPhysics.K.BALL_R, 24, 16), new THREE.MeshStandardMaterial({ color: 0xd2691e })); b.castShadow = true; scene.add(b); ballMesh.push(b);
    return pl;
  });
  return Object.fromEntries(HoopRoster.CHARACTERS.map(c => [c.id, models[c.id].dims]));
});
// scenario runner: place players side by side, run states, render
window.run = (scenario, tShot, view) => {
  const xs = [-1.6, 0, 1.6];
  players.forEach((pl, i) => {
    pl.targetHoop = 0;
    // stand facing +x (toward hoop 0) — hoop far away; side view camera looks along -z
    pl.placeAt(xs[i] + 5, 0, Math.PI / 2); // x offset keeps them separated along x... use z separation instead
    pl.placeAt(4, xs[i] * 1.0, Math.PI / 2);
    pl.hasBall = scenario !== 'idle_noball' && scenario !== 'run_noball';
    pl.ballPos.set(pl.x + 0.25, 1.05, pl.z);
    let now = 0; const dt = 1 / 120;
    const inp = { mx: 0, mz: 0, sprint: false, walk: false };
    if (scenario === 'run' || scenario === 'run_noball') { inp.mx = 1; }
    const steps = scenario.startsWith('run') ? Math.round((tShot || 1.2) * 120) : 60;
    for (let k = 0; k < steps; k++) { now += dt; pl.update(dt, inp, now); pl.computePose(dt); HoopCharacters.applyPose(pl.model, pl.pose); }
    if (scenario === 'shot') {
      pl.startShot(now);
      const n = Math.round(tShot * 120);
      for (let k = 0; k < n; k++) { now += dt; pl.update(dt, null, now); if (pl.shot && !pl.shot.released && pl.shot.t >= pl.shot.T) pl.release(pl.shot.t); pl.computePose(dt); HoopCharacters.applyPose(pl.model, pl.pose); }
    }
    ballMesh[i].position.copy(pl.ballPos); ballMesh[i].visible = pl.hasBall || (scenario === 'shot');
    if (scenario === 'shot' && pl.shot && pl.shot.released) ballMesh[i].visible = false;
  });
  const cx = players[1].x, cz = 0;
  if (view === 'front') { camera.position.set(cx + 9, 1.3, cz); camera.lookAt(cx, 1.05, cz); }
  else if (view === 'back') { camera.position.set(cx - 9, 1.4, cz); camera.lookAt(cx, 1.05, cz); }
  else { camera.position.set(cx + 0.6, 1.35, cz + 9.5); camera.lookAt(cx + 0.6, 1.05, cz); }
  renderer.render(scene, camera);
  return players.map(pl => ({ shot: pl.shot ? { T: pl.shot.T, t: pl.shot.t, rel: pl.shot.released } : null, x: pl.x.toFixed(2), ball: pl.ballPos.toArray().map(v => +v.toFixed(2)) }));
};
</script></body></html>
